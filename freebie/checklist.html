    --terracotta-soft:#D89A7E;

    --gold-deco:#D4AF37;

  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#17130F;
      --sand:#211B15;
      --sand-deep:#2A2219;
      --line:#3A3025;
      --ink:#F3ECE2;
      --ink-soft:#B8AA99;
      --ink-faint:#8A7E70;
      --terracotta:#E3A47C;

      --gold-deco:#D9B54B;
      --focus:#D9B54B;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.4);
    }
  }

    --cream:#17130F;
    --sand:#211B15;
    --sand-deep:#2A2219;
    --line:#3A3025;
    --ink:#F3ECE2;
    --ink-soft:#B8AA99;
    --ink-faint:#8A7E70;
    --terracotta:#E3A47C;
    --terracotta-tint:#3A2A20;
    --terracotta-soft:#8C5A3D;

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--terracotta-soft); color:var(--cream); }

  a{ color:var(--terracotta); }
  a:focus-visible, button:focus-visible, label:focus-within .box{
    outline:2px solid var(--focus); outline-offset:2px;
  }

  .topbar{
    position:sticky; top:0; z-index:20;
    height:3px; width:100%;
    background:var(--line);
  }
  .topbar-fill{
    height:100%; width:0%;
    background:var(--gold-deco);
    transition:width .35s ease;
  }
  @media (prefers-reduced-motion: reduce){ .topbar-fill{ transition:none; } }

  .page{ max-width:760px; margin:0 auto; padding:0 24px 72px; }

  .runner{
    display:flex; justify-content:space-between; align-items:center;
    padding:28px 0 20px;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .runner strong{ color:var(--ink-soft); font-weight:600; }
  .lang{ display:flex; align-items:center; gap:10px; }
  .lang button{
    font:inherit; letter-spacing:inherit; text-transform:inherit;
    background:none; border:none; padding:2px 0; cursor:pointer;
    color:var(--ink-faint); border-bottom:1px solid transparent;
  }
  .lang button[aria-pressed="true"]{
    color:var(--terracotta); border-bottom-color:var(--terracotta);
  }
  .lang .sep{ color:var(--line); }

  header.hero{ padding:8px 0 40px; }
  .kicker{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--terracotta-soft); font-weight:600; margin:0 0 18px;
  }
  h1.title{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-weight:400; line-height:1.02; margin:0;
    font-size:clamp(2.6rem, 6vw, 3.6rem);
    text-wrap:balance;
  }
  h1.title .accent{ display:block; color:var(--terracotta-soft); font-style:normal; }
  p.subtitle{
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic; font-weight:400; color:var(--ink-soft);
    font-size:1.3rem; line-height:1.4; margin:22px 0 0; max-width:34ch;
  }
  .rule{ width:44px; height:2px; background:var(--gold-deco); border:none; margin:26px 0; }
  p.intro{ color:var(--ink-soft); font-size:.98rem; line-height:1.7; max-width:60ch; margin:0; }

  nav.inside{ margin-top:34px; border-top:1px solid var(--line); padding-top:18px; }
  nav.inside .label{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:12px; }
  nav.inside ol{ list-style:none; margin:0; padding:0; display:grid; gap:2px; }
  nav.inside a{
    display:flex; gap:14px; align-items:baseline; text-decoration:none;
    padding:8px 0; color:var(--ink); border-bottom:1px solid var(--line);
    font-size:.95rem;
  }
  nav.inside a:last-child{ border-bottom:none; }
  nav.inside a:hover{ color:var(--terracotta); }
  nav.inside .num{ color:var(--terracotta); font-variant-numeric:tabular-nums; width:1.4em; }
  nav.inside .frac{ margin-left:auto; color:var(--ink-faint); font-variant-numeric:tabular-nums; font-size:.85rem; }

  section.stage{ padding:44px 0; border-top:1px solid var(--line); }
  .stage-head{ display:flex; gap:20px; align-items:flex-start; margin-bottom:8px; }
  .stage-num{
    font-family:'Cormorant Garamond', serif; font-weight:400;
    font-size:2.6rem; line-height:1; color:var(--terracotta-soft);
  }
  .stage-titles{ flex:1; }
  .stage-titles h2{
    font-family:'Cormorant Garamond', serif; font-weight:500;
    font-size:1.55rem; margin:2px 0 4px; line-height:1.2;
  }
  .stage-titles p{
    font-family:'Cormorant Garamond', serif; font-style:italic;
    color:var(--ink-soft); margin:0; font-size:1rem;
  }
  .stage-frac{
    font-variant-numeric:tabular-nums; color:var(--ink-faint);

  .stage-frac b{ color:var(--terracotta); font-weight:600; }
  .stage-bar{ height:3px; background:var(--line); border-radius:2px; margin:18px 0 4px; overflow:hidden; }
  .stage-bar i{ display:block; height:100%; background:var(--terracotta-soft); width:0%; transition:width .3s ease; font-style:normal; }

  ul.items{ list-style:none; margin:12px 0 0; padding:0; }

    padding:16px 6px; cursor:pointer; border-radius:8px;
  }
  ul.items label:hover{ background:var(--sand); }
  ul.items input{ position:absolute; opacity:0; width:1px; height:1px; }
  .box{
    flex:none; width:19px; height:19px; margin-top:2px;
    border:1.5px solid var(--ink-faint); border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease, border-color .15s ease;
  }
  .box svg{ width:11px; height:11px; opacity:0; transform:scale(.6); transition:opacity .12s ease, transform .12s ease; }
  input:checked ~ .box{ background:var(--terracotta); border-color:var(--terracotta); }
  input:checked ~ .box svg{ opacity:1; transform:scale(1); }
  input:focus-visible ~ .box{ outline:2px solid var(--focus); outline-offset:2px; }
  .item-text{ font-size:1rem; line-height:1.5; color:var(--ink); transition:color .15s ease; }
  input:checked ~ .item-text{ color:var(--ink-faint); text-decoration:line-through; text-decoration-color:var(--line); text-decoration-thickness:1px; }

  section.snapshot{
    margin-top:16px; padding:40px 0 8px; border-top:1px solid var(--line);

  .snap-card{
    background:var(--sand); border:1px solid var(--line); border-radius:16px;

  .snap-top{ display:flex; flex-wrap:wrap; gap:28px; align-items:flex-end; justify-content:space-between; }
  .snap-count{ font-family:'Cormorant Garamond', serif; font-weight:400; font-size:3.4rem; line-height:1; font-variant-numeric:tabular-nums; }
  .snap-count small{ font-family:'Inter'; font-size:.95rem; color:var(--ink-faint); font-weight:500; margin-left:8px; }
  .snap-hint{ font-size:.85rem; color:var(--ink-faint); max-width:26ch; }

  .outcome{
    margin-top:26px; padding:20px 22px; border-left:2px solid var(--gold-deco);
    background:var(--terracotta-tint); border-radius:0 10px 10px 0;

  .outcome .msg{ font-family:'Cormorant Garamond', serif; font-size:1.3rem; line-height:1.35; }
  .outcome .msg strong{ font-weight:600; }

  .gapchart{ margin-top:26px; display:grid; gap:12px; }
  .gapchart .row{ display:grid; grid-template-columns:120px 1fr 46px; align-items:center; gap:12px; }
  .gapchart .name{ font-size:.82rem; color:var(--ink-soft); }
  .gapchart .track{ height:7px; background:var(--line); border-radius:5px; overflow:hidden; }
  .gapchart .fill{ height:100%; background:var(--gold-deco); border-radius:5px; transition:width .3s ease; }
  .gapchart .val{ font-size:.78rem; color:var(--ink-faint); text-align:right; font-variant-numeric:tabular-nums; }

  section.next{ padding:56px 0 8px; border-top:1px solid var(--line); margin-top:16px; }
  .next .kicker{ margin-bottom:16px; }
  .next h3{
    font-family:'Cormorant Garamond', serif; font-weight:500; font-size:1.8rem;
    line-height:1.3; margin:0; max-width:22ch; text-wrap:balance;
  }
  .next .contact{ margin-top:26px; font-size:.98rem; line-height:2; }
  .next .contact a{ text-decoration:none; }
  .next .contact a:hover{ text-decoration:underline; }

  footer{ margin-top:56px; padding-top:24px; border-top:1px solid var(--line); }
  .footer-brand{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); }
  .footer-legal{ font-size:.78rem; color:var(--ink-faint); line-height:1.6; max-width:62ch; margin:12px 0 0; }
  .reset-row{ margin-top:22px; display:flex; align-items:center; gap:16px; }
  .reset-row button{
    font:inherit; font-size:.82rem; color:var(--ink-faint); background:none;
    border:none; padding:0; cursor:pointer; text-decoration:underline;
    text-decoration-color:var(--line);
  }
  .reset-row button:hover{ color:var(--terracotta); text-decoration-color:var(--terracotta); }
  .reset-row .saved{ font-size:.78rem; color:var(--ink-faint); }

  .gate-card p.kicker{ margin-bottom:14px; }
  .gate-body{ color:var(--ink-soft); font-size:.98rem; line-height:1.7; margin:0 0 28px; max-width:46ch; }
  .tally-embed-wrap{ min-height:640px; }
  .tally-embed-wrap iframe{ border:none; width:100%; display:block; }
</style>

      outcomes:{

      },
      nextKicker:"NEXT STEP",

      email:"admin@luminevaaurorae.com",

      footerLegal:"Lumineva Aurorae — Operations & Systems Partner for coaches. Demonstration projects shown on the website are examples of process thinking, not client results.",

      saved:"Your progress is saved in this browser only.",
      gateKicker:"BEFORE YOU START",
      gateHeading:"Unlock the checklist",
      gateBody:"Enter your name and email below — the audit unlocks immediately, and your progress saves in this browser."
    },
    id: {
      audienceTag: "UNTUK COACH",
      kicker: "THE OPERATIONS AUDIT",
      subtitle: "Audit sederhana untuk jalur inquiry, booking, dan onboarding Anda — kini interaktif.",
      intro: "Tandai yang sudah berjalan. Yang tersisa adalah titik di mana client journey Anda kehilangan kejelasan — snapshot di bawah akan menunjukkan titik awalnya.",

        { title:"Jalur booking", desc:"Dari ketertarikan sampai booking terkonfirmasi.", nav:"Booking", items:[

        { title:"Jalur client onboarding", desc:"Dari persetujuan atau pembayaran sampai sesi pertama.", nav:"Client onboarding", items:[

          "Apakah formulir, perjanjian, dan materi persiapan mudah ditemukan?",

        { title:"Kepemilikan dan dokumentasi", desc:"Bisakah orang lain mengikuti proses ini?", nav:"Kepemilikan", items:[

      ],
      snapKicker:"MULAI DARI MANA",
      snapHeading:"Interpretasi",
      snapHint:"Tandai item di atas — bagian ini akan diperbarui seiring Anda mengisi.",
      checkedWord:"tercentang",
      ofWord:"dari",
      outcomes:{
        0:{tag:"SEBAGIAN BESAR CELAH DI INQUIRY", pre:"Mulai dengan ", strong:"Inquiry Path Build", post:"."},

        spread:{tag:"CELAH DI SEMUA TAHAP", pre:"Mulai dengan ", strong:"Client Journey Review", post:" untuk menemukan titik awalnya."},
        clear:{tag:"FONDASI SUDAH KUAT", pre:"Semua tahap sudah tertangani. Langkah berikutnya adalah ", strong:"menyempurnakan, bukan membangun ulang", post:"."}

      reset:"Reset checklist",
      saved:"Progres Anda hanya tersimpan di browser ini.",
      gateKicker:"SEBELUM MULAI",
      gateHeading:"Buka checklist ini",
      gateBody:"Masukkan nama dan email Anda di bawah — audit akan langsung terbuka, dan progres Anda tersimpan di browser ini."
    }
  };

  var TALLY_FORM_ID = "ZjMVKz";
  var STORE_KEY = "loa-ops-audit-v1";
  var state = { lang:"en", checked:{}, unlocked:false };
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ var parsed = JSON.parse(raw); if(parsed && typeof parsed==="object"){ state = Object.assign(state, parsed); } }
  }catch(e){}
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function checkSvg(){
    return '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="var(--cream)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function totalItems(c){
    return c.stages.reduce(function(sum, s){ return sum + s.items.length; }, 0);
  }

  function gapsBySection(c){
    return c.stages.map(function(s, si){
      var checkedN = 0;
      s.items.forEach(function(_, ii){ if(state.checked[si+"-"+ii]) checkedN++; });
      return { total:s.items.length, checked:checkedN, gaps:s.items.length - checkedN };
    });
  }

  function computeOutcome(c){
    var gaps = gapsBySection(c);
    var total = totalItems(c);
    var totalChecked = gaps.reduce(function(a,g){return a+g.checked;},0);
    if(totalChecked === total) return { key:"clear", gaps:gaps, totalChecked:totalChecked, total:total };
    var candidates = gaps.map(function(g, i){ return { i:i, gaps:g.gaps }; })
                         .sort(function(a,b){ return b.gaps - a.gaps; });
    var top = candidates[0], second = candidates[1];
    if(top.i < 3 && top.gaps > 0 && (top.gaps - second.gaps) >= 2){
      return { key:top.i, gaps:gaps, totalChecked:totalChecked, total:total };
    }
    return { key:"spread", gaps:gaps, totalChecked:totalChecked, total:total };
  }

  function renderStatic(){
    var c = CONTENT[state.lang];
    document.documentElement.lang = state.lang;
    document.getElementById("rAudience").textContent = c.audienceTag;
    document.getElementById("kicker").textContent = c.kicker;
    document.getElementById("subtitle").textContent = c.subtitle;
    document.getElementById("intro").textContent = c.intro;
    document.getElementById("btnEn").setAttribute("aria-pressed", state.lang==="en");
    document.getElementById("btnId").setAttribute("aria-pressed", state.lang==="id");

    var nav = document.getElementById("insideNav");
    var stagesEl = document.getElementById("stages");

    if(!state.unlocked){
      nav.innerHTML = "";
      stagesEl.innerHTML =
        '<div class="snap-card gate-card">' +
          '<p class="kicker">'+c.gateKicker+'</p>' +
          '<h2 style="font-family:\'Cormorant Garamond\',serif;font-weight:500;font-size:1.7rem;margin:0 0 14px">'+c.gateHeading+'</h2>' +
          '<p class="gate-body">'+c.gateBody+'</p>' +
          '<div class="tally-embed-wrap">' +
            '<iframe src="https://tally.so/embed/'+TALLY_FORM_ID+'?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="640" title="Operations Audit Checklist — Access"></iframe>' +
          '</div>' +
        '</div>';
      loadTally();
      document.getElementById("snapshotSection").innerHTML = "";
      document.getElementById("nextSection").innerHTML = "";
      document.getElementById("resetBtn").textContent = "";
      document.getElementById("savedNote").textContent = "";
      document.getElementById("footerBrand").textContent = "LUMINEVA AURORAE";
      document.getElementById("footerLegal").textContent = c.footerLegal;
      document.getElementById("topbarFill").style.width = "0%";
      return;
    }

    var navHtml = '<p class="label">'+c.insideLabel+'</p><ol>';
    c.stages.forEach(function(s, i){
      navHtml += '<li><a href="#stage-'+i+'"><span class="num">0'+(i+1)+'</span><span>'+s.nav+'</span><span class="frac" data-navfrac="'+i+'"></span></a></li>';
    });
    navHtml += '</ol>';
    nav.innerHTML = navHtml;

    var html = "";
    c.stages.forEach(function(s, si){
      html += '<section class="stage" id="stage-'+si+'">';
      html += '<div class="stage-head"><div class="stage-num">0'+(si+1)+'</div><div class="stage-titles"><h2>'+s.title+'</h2><p>'+s.desc+'</p></div><div class="stage-frac" data-stagefrac="'+si+'"></div></div>';
      html += '<div class="stage-bar"><i data-stagebar="'+si+'"></i></div>';
      html += '<ul class="items">';
      s.items.forEach(function(text, ii){
        var id = si+"-"+ii;
        var isChecked = !!state.checked[id];
        html += '<li><label><input type="checkbox" data-id="'+id+'" '+(isChecked?"checked":"")+'><span class="box">'+checkSvg()+'</span><span class="item-text">'+text+'</span></label></li>';
      });
      html += '</ul></section>';
    });
    stagesEl.innerHTML = html;

    document.getElementById("nextSection").innerHTML =
      '<p class="kicker">'+c.nextKicker+'</p>' +
      '<h3>'+c.nextHeading+'</h3>' +
      '<hr class="rule">' +
      '<div class="contact">' +
        '<div><a href="mailto:'+c.email+'">'+c.email+'</a></div>' +
        '<div><a href="https://'+c.link+'" target="_blank" rel="noopener">'+c.link+'</a></div>' +
      '</div>';

    document.getElementById("footerBrand").textContent = "LUMINEVA AURORAE";
    document.getElementById("footerLegal").textContent = c.footerLegal;
    document.getElementById("resetBtn").textContent = c.reset;
    document.getElementById("savedNote").textContent = c.saved;

    document.getElementById("snapshotSection").innerHTML =
      '<div class="snap-card">' +
        '<p class="kicker" style="margin-bottom:14px">'+c.snapKicker+'</p>' +
        '<h2 style="font-family:\'Cormorant Garamond\',serif;font-weight:500;font-size:1.7rem;margin:0 0 18px">'+c.snapHeading+'</h2>' +
        '<div class="snap-top">' +
          '<div class="snap-count"><span id="snapCheckedNum">0</span><small id="snapCheckedLbl"></small></div>' +
          '<div class="snap-hint" id="snapHint"></div>' +
        '</div>' +
        '<div class="outcome" id="outcomeBox"></div>' +
        '<div class="gapchart" id="gapChart"></div>' +
      '</div>';

    updateDynamic();
  }

  function updateDynamic(){
    var c = CONTENT[state.lang];
    var result = computeOutcome(c);
    var total = result.total, totalChecked = result.totalChecked;

    document.getElementById("topbarFill").style.width = (total? (totalChecked/total*100):0) + "%";

    c.stages.forEach(function(s, si){
      var g = result.gaps[si];
      var fracEl = document.querySelector('[data-stagefrac="'+si+'"]');
      if(fracEl) fracEl.innerHTML = '<b>'+g.checked+'</b> / '+g.total;
      var navFracEl = document.querySelector('[data-navfrac="'+si+'"]');
      if(navFracEl) navFracEl.textContent = g.checked+'/'+g.total;
      var barEl = document.querySelector('[data-stagebar="'+si+'"]');
      if(barEl) barEl.style.width = (g.total? (g.checked/g.total*100):0) + "%";
    });

    document.getElementById("snapCheckedNum").textContent = totalChecked + " / " + total;
    document.getElementById("snapCheckedLbl").textContent = c.checkedWord;
    document.getElementById("snapHint").textContent = totalChecked===0 ? c.snapHint : "";

    var o = c.outcomes[result.key];
    document.getElementById("outcomeBox").innerHTML =
      '<div class="tag">'+o.tag+'</div>' +
      '<div class="msg">'+o.pre+'<strong>'+o.strong+'</strong>'+o.post+'</div>';

    var chartHtml = "";
    c.stages.forEach(function(s, si){
      var g = result.gaps[si];
      var pct = g.total ? (g.gaps/g.total*100) : 0;
      chartHtml += '<div class="row"><span class="name">'+s.nav+'</span><span class="track"><span class="fill" style="width:'+pct+'%"></span></span><span class="val">'+g.gaps+'/'+g.total+'</span></div>';
    });
    document.getElementById("gapChart").innerHTML = chartHtml;
  }

  function loadTally(){
    var w = "https://tally.so/widgets/embed.js";
    if(typeof Tally === "undefined" && !document.querySelector('script[src="'+w+'"]')){
      var s = document.createElement("script");
      s.src = w;
      document.body.appendChild(s);
    }
  }

  window.addEventListener("message", function(e){
    var data = e.data;
    if(typeof data === "string"){
      try{ data = JSON.parse(data); }catch(err){ return; }
    }
    if(data && data.event === "Tally.FormSubmitted"){
      state.unlocked = true;
      save();
      renderStatic();
    }
  });

  document.getElementById("stages").addEventListener("change", function(e){
    var t = e.target;
    if(t && t.matches('input[type="checkbox"][data-id]')){
      if(t.checked) state.checked[t.dataset.id] = true; else delete state.checked[t.dataset.id];
      save();
      updateDynamic();
    }
  });

  document.querySelectorAll(".lang button").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.lang = btn.dataset.lang;
      save();
      renderStatic();
    });
  });

  document.getElementById("resetBtn") && document.getElementById("resetBtn").addEventListener("click", function(){});

  document.addEventListener("click", function(e){
    if(e.target && e.target.id === "resetBtn"){
      state.checked = {};
      save();
      renderStatic();
    }
  });

  renderStatic();
})();
</script>
